[build-system]
requires = ["setuptools>=80.10", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "floeval"
version = "0.1.2"
description = "Multi-backend evaluation framework for LLM and RAG systems"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Floeval Team"}
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
    "deepeval>=3.8.2",
    "ragas>=0.4.3",
    "langchain-openai>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
flotorch = [
    "google-adk>=1.5.0",
    "httpx>=0.24",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pylint>=4.0.4",
    "ruff>=0.14.14",
]

[project.scripts]
floeval = "floeval.cli.main:main"

[tool.setuptools.packages.find]
include = ["floeval*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "D", "B"]
ignore = ["D100", "D107"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "R0913",  # too-many-arguments
]

[tool.pylint.format]
max-line-length = 100


