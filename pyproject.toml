[project]
name = "floeval"
version = "0.1.0"
description = "Evaluation framework for LLM and RAG systems"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Floeval Team"}
]
dependencies = [
    "deepeval>=3.8.2",
    "ragas>=0.4.3",
    "langchain-openai>=1.0.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pylint>=4.0.4",
    "ruff>=0.14.14",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "R0913",  # too-many-arguments
]

[tool.pylint.format]
max-line-length = 100


