[build-system]
requires = ["setuptools>=80.10", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floeval"
version = "1.1.0b1"
description = "A multi-backend evaluation framework for LLM, RAG, and agentic systems."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Floeval Team", email = "org.admin@flotorch.ai"}
]

maintainers = [
    {name = "Shiva Prasad", email = "shiva.tantarapelly@flotorch.ai"},
    {name = "Tuhin Mitra", email = "tuhin@flotorch.ai"}
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = [
    "deepeval>=3.8.2",
    "ragas>=0.4.3",
    "langchain-openai>=1.0.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "build>=1.4.0",
    "mkdocs>=1.6.1",
    "mypy>=1.19.1",
    "pylance>=3.0.1",
    "pylint>=4.0.4",
    "pymdown-extensions>=10.21",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.14.14",
    "twine>=6.2.0",
    "types-pyyaml>=6.0.12.20250915",
]

[project.optional-dependencies]
flotorch = [
    "google-adk>=1.5.0",
    "httpx>=0.24",
]

[project.urls]
Homepage = "https://github.com/FloTorch/floeval"
Repository = "https://github.com/FloTorch/floeval"
Documentation = "https://flotorch.github.io/floeval/"
Issues = "https://github.com/FloTorch/floeval/issues"

[project.scripts]
floeval = "floeval.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["floeval*"]

[tool.setuptools.package-data]
floeval = ["*.py", "**/*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Enable `ruff format` / `ruff check` on Jupyter notebooks (code cells).
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "D", "B"]
ignore = ["D100", "D107"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

# Notebook cells are not full modules; skip rules that assume top-level structure.
[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    "D",
    "E402",
    "E501",
    "I",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "R0913",  # too-many-arguments
]

[tool.pylint.format]
max-line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
markers = [
    "unit: fast tests; no third-party metric execution or network",
    "integration: real APIs, LLM, or full Evaluation.run against a backend",
    "deepeval: integration test uses only DeepEval metrics",
    "ragas: integration test uses only RAGAS metrics",
    "builtin: integration test uses only builtin metrics",
    "slow: timing or long-running checks",
]

