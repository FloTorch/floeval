[build-system]
requires = ["setuptools>=80.10", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floeval"
version = "0.1.0b1"
description = "A multi-backend evaluation framework for LLM, RAG, and agentic systems."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Floeval Team", email = "org.admin@flotorch.ai"}
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = [
    "deepeval>=3.8.2",
    "ragas>=0.4.3",
    "langchain-openai>=1.0.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "build>=1.4.0",
    "mkdocs>=1.6.1",
    "mypy>=1.19.1",
    "pylint>=4.0.4",
    "pymdown-extensions>=10.21",
    "ruff>=0.14.14",
    "twine>=6.2.0",
]

[project.optional-dependencies]
flotorch = [
    "google-adk>=1.5.0",
    "httpx>=0.24",
]

[project.urls]
Homepage = "https://github.com/FloTorch/floeval"
Repository = "https://github.com/FloTorch/floeval"
Documentation = "https://flotorch.github.io/floeval/"
Issues = "https://github.com/FloTorch/floeval/issues"

[project.scripts]
floeval = "floeval.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["floeval*"]

[tool.setuptools.package-data]
floeval = ["*.py", "**/*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "D", "B"]
ignore = ["D100", "D107"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "R0913",  # too-many-arguments
]

[tool.pylint.format]
max-line-length = 100


