[project]
name = "floeval"
version = "0.1.0"
description = "Evaluation framework for LLM and RAG systems"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Floeval Team"}
]
dependencies = [
    "deepeval>=3.8.2",
    "ragas>=0.4.3",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pylint>=4.0.4",
    "ruff>=0.14.14",
]


