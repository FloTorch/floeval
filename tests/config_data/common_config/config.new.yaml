dataset_generation_config:
  generator_model: flotorch/evaluation-testing-chat-model
evaluation_config:
  prompts_file: "tests/config_data/datasets/prompts.yaml"
  metric_params:
    answer_relevancy:
      threshold: 0.8
  metrics:
    # - deepeval:answer_relevancy
    - ragas:answer_relevancy
llm_config:
  api_key: ${FLOEVAL_API_KEY}
  base_url: https://gateway.flotorch.cloud/openai/v1/
  chat_model: flotorch/evaluation-testing-chat-model
  embedding_model: flotorch/evaluation-testing-embedding-model
