site_name: Floeval
site_url: https://github.com/FloTorch/floeval
site_description: Multi-backend evaluation framework for LLM, RAG, prompt, and agent systems

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - yaml
    - python
    - cmd
    - bash
    - json


markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji

nav:
  - Home: index.md
  - Prerequisites & Setup: setup.md
  - Minimal Examples: copy-run.md
  - All Examples: examples.md
  - Prompt Evaluation: prompt-evaluation.md
  - Agent Evaluation: agent-evaluation.md
  - Agentic Workflow: agentic-workflow.md
  - Agent Tracing: agent-tracing.md
  - Metrics: metrics.md
  - Custom Metrics: custom-metrics.md
  - API Reference: api-reference.md
  - Troubleshooting: troubleshooting.md

plugins:
  - search

extra_css:
  - stylesheets/extra.css